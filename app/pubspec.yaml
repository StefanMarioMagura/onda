name: onda
description: "ONDA: lo que pasa en el mundo, por lo que te cuesta."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_tts: ^4.2.5
  go_router: ^18.1.2
  shared_preferences: ^2.5.6
  supabase_flutter: ^2.18.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    # Variable font (OFL, weight + width axes), bundled so the app never fetches it from Google.
    - family: Archivo
      fonts:
        - asset: assets/fonts/Archivo.ttf
