name: Ingest fuel prices

on:
  schedule:
    # Every 30 min. Offset from :00/:30 because GitHub delays jobs at the top of the hour.
    - cron: "7,37 * * * *"
  workflow_dispatch:

concurrency:
  group: ingest-prices
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: workers
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: workers/pyproject.toml

      - name: Install
        run: pip install .

      - name: Ingest snapshot
        env:
          # Supabase pooler connection string (session mode, port 5432).
          # GitHub runners have no IPv6, so the direct db.<ref>.supabase.co host won't work.
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python -m onda_workers.ingest_prices
