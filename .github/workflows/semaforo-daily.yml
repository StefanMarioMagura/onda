name: Semáforo daily forecast

on:
  # Right after the daily prices are loaded, so the forecast uses yesterday's data.
  workflow_run:
    workflows: ["Ingest daily price history"]
    types: [completed]
  # Fallback if the chained run doesn't happen (GitHub's schedule is best effort).
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

concurrency:
  group: semaforo-daily
  cancel-in-progress: false

jobs:
  forecast:
    # Don't forecast on top of a failed price load; the fallback run will retry.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: workers
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: workers/pyproject.toml

      - name: Install
        run: pip install '.[model]'

      - name: Forecast and store
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python -m onda_workers.semaforo.daily
