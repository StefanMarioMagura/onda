name: Ingest daily price history

on:
  schedule:
    # Once a day. Each run fills every missing day, so a skipped run is
    # caught up by the next one.
    - cron: "23 6 * * *"
  workflow_dispatch:

concurrency:
  group: ingest-daily-history
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    # The worker stops by itself after 320 min (--max-minutes) and the next run
    # continues; the initial backfill needs a few runs. GitHub's limit is 6 h.
    timeout-minutes: 340
    defaults:
      run:
        working-directory: workers
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: workers/pyproject.toml

      - name: Install
        run: pip install .

      - name: Load missing days
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python -m onda_workers.daily_history --max-minutes 320
