name: Generate draft ondas

# Drafts only: a person reviews them with `python -m onda_workers.news.review`
# before anything appears in the app.
on:
  schedule:
    - cron: "40 5 * * *"     # 06:40 Madrid (winter), so drafts are ready to review in the morning
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only list candidate events (no Claude calls)"
        type: boolean
        default: false

concurrency:
  group: generate-ondas
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: workers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: workers/pyproject.toml
      - name: Install
        run: pip install '.[news]'
      - name: Write drafts for the best covered events
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m onda_workers.news.generate ${{ inputs.dry_run && '--dry-run' || '' }}
