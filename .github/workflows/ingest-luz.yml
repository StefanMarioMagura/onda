name: Ingest electricity prices (PVPC)

on:
  schedule:
    # 20:30 UTC (21:30 Madrid in winter): after REE publishes tomorrow's prices.
    - cron: "30 20 * * *"
    # Morning fallback, so today's prices are there even if the evening run was skipped.
    - cron: "10 5 * * *"
  workflow_dispatch:

concurrency:
  group: ingest-luz
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: workers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: workers/pyproject.toml
      - name: Install
        run: pip install .
      - name: Load today and tomorrow
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python -m onda_workers.luz
